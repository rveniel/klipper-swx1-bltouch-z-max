# =====================================================================
#  Stack Klipper pour Sidewinder X1 — Unraid
#  Klipper + Moonraker + Mainsail + webcam, derrière Traefik.
#  Adapté de prind (https://github.com/mkuf/prind), mêmes images.
#
#  Seuls ce fichier et le .env sont nécessaires : les configs sont
#  téléchargées dans STACK_DIR au premier démarrage, puis restent à toi.
#  Interface :   http://<ip-du-serveur>:<HTTP_PORT>
#  Firmware :    voir le README (commande docker run unique)
# =====================================================================

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # Au premier démarrage : télécharge les configs par défaut depuis GitHub
  # (sans jamais écraser un fichier existant), renseigne le port série,
  # puis donne les dossiers à l'utilisateur 1000 des images Klipper/Moonraker.
  init:
    image: curlimages/curl:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      REPO_RAW: https://raw.githubusercontent.com/rveniel/klipper-swx1-bltouch-z-max/${CONFIG_REF:-main}
      MCU_SERIAL: ${MCU_SERIAL:-}
    command:
      - |
        set -e
        mkdir -p /stack/config /stack/gcodes /stack/logs /stack/database /stack/firmware /stack/resonances
        for f in config/printer.cfg config/macros.cfg config/moonraker.conf firmware/build.config; do
          if [ ! -f "/stack/$$f" ]; then
            echo "Téléchargement de $$f"
            curl -fsSL "$$REPO_RAW/$$f" -o "/stack/$$f"
          fi
        done
        if [ -n "$$MCU_SERIAL" ]; then
          sed -i "s#^serial: /dev/serial/by-id/CHANGEME#serial: $$MCU_SERIAL#" /stack/config/printer.cfg
        fi
        chown -R 1000:1000 /stack/config /stack/gcodes /stack/logs /stack/database /stack/resonances
    volumes:
      - ${STACK_DIR:-/mnt/user/appdata/klipper-swx1}:/stack

  klipper:
    image: mkuf/klipper:latest
    restart: unless-stopped
    # Accès à /dev complet : le chemin /dev/serial/by-id reste valable
    # après une déconnexion/reconnexion USB de la carte.
    privileged: true
    # Klipper tourne en uid 1000 : il doit être membre du groupe qui possède
    # le port série sur l'hôte (voir SERIAL_GID dans .env).
    group_add:
      - "${SERIAL_GID:-16}"
    <<: *logging
    depends_on:
      init:
        condition: service_completed_successfully
    command: >
      -I printer_data/run/klipper.tty
      -a printer_data/run/klipper.sock
      printer_data/config/printer.cfg
      -l printer_data/logs/klippy.log
    volumes:
      - /dev:/dev
      - ${STACK_DIR:-/mnt/user/appdata/klipper-swx1}/config:/opt/printer_data/config
      - ${STACK_DIR:-/mnt/user/appdata/klipper-swx1}/gcodes:/opt/printer_data/gcodes
      - ${STACK_DIR:-/mnt/user/appdata/klipper-swx1}/logs:/opt/printer_data/logs
      # Les CSV d'input shaping (TEST_RESONANCES) sont écrits dans /tmp
      - ${STACK_DIR:-/mnt/user/appdata/klipper-swx1}/resonances:/tmp
      - run:/opt/printer_data/run

  moonraker:
    image: mkuf/moonraker:latest
    restart: unless-stopped
    <<: *logging
    depends_on:
      init:
        condition: service_completed_successfully
      klipper:
        condition: service_started
    volumes:
      - /dev/null:/opt/klipper/config/null
      - /dev/null:/opt/klipper/docs/null
      - ${STACK_DIR:-/mnt/user/appdata/klipper-swx1}/config:/opt/printer_data/config
      - ${STACK_DIR:-/mnt/user/appdata/klipper-swx1}/gcodes:/opt/printer_data/gcodes
      - ${STACK_DIR:-/mnt/user/appdata/klipper-swx1}/logs:/opt/printer_data/logs
      - ${STACK_DIR:-/mnt/user/appdata/klipper-swx1}/database:/opt/printer_data/database
      - run:/opt/printer_data/run
    labels:
      traefik.enable: true
      traefik.http.services.moonraker.loadbalancer.server.port: 7125
      traefik.http.routers.moonraker.rule: PathRegexp(`^/(websocket|printer|api|access|machine|server)`)
      traefik.http.routers.moonraker.entrypoints: web

  mainsail:
    image: ghcr.io/mainsail-crew/mainsail:edge
    restart: unless-stopped
    <<: *logging
    labels:
      traefik.enable: true
      traefik.http.services.mainsail.loadbalancer.server.port: 80
      traefik.http.routers.mainsail.rule: PathPrefix(`/`)
      traefik.http.routers.mainsail.entrypoints: web

  # Webcam USB (ustreamer). Retirer ce service si aucune webcam n'est branchée.
  webcam:
    image: mkuf/ustreamer:latest
    restart: unless-stopped
    <<: *logging
    command: >
      --host=0.0.0.0
      --port=8080
      --slowdown
      --device=/dev/webcam
      --resolution=1280x720
      --format=MJPEG
      --desired-fps=30
    devices:
      - ${WEBCAM_DEVICE:-/dev/video0}:/dev/webcam
    labels:
      traefik.enable: true
      traefik.http.services.webcam.loadbalancer.server.port: 8080
      traefik.http.routers.webcam.rule: PathPrefix(`/webcam`)
      traefik.http.routers.webcam.entrypoints: web
      traefik.http.middlewares.webcam.stripprefix.prefixes: /webcam
      traefik.http.routers.webcam.middlewares: webcam

  # Point d'entrée unique : Mainsail, l'API Moonraker et la webcam sur le même port.
  traefik:
    image: traefik:3.7
    restart: unless-stopped
    <<: *logging
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${HTTP_PORT:-8090}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  run:
    driver_opts:
      type: tmpfs
      device: tmpfs
