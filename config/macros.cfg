# =====================================================================
#  Macros Sidewinder X1
#  Si tu inclus le mainsail.cfg officiel (PAUSE/RESUME/CANCEL_PRINT),
#  supprime la section "Pause / reprise / annulation" ci-dessous.
# =====================================================================

# ---------------------------------------------------------------------
# Début / fin d'impression (reprend le G-code OrcaSlicer de l'époque Marlin)
#
# OrcaSlicer, G-code de démarrage :
#   SET_PRINT_STATS_INFO TOTAL_LAYER_COUNT=[total_layer_count]
#   PRINT_START BED_TEMP=[bed_temperature_initial_layer_single] EXTRUDER_TEMP=[nozzle_temperature_initial_layer]
# G-code de fin :
#   PRINT_END
# G-code avant changement de couche :
#   SET_PRINT_STATS_INFO CURRENT_LAYER={layer_num + 1}
# G-code de pause :
#   PAUSE
# ---------------------------------------------------------------------
[gcode_macro PRINT_START]
gcode:
    {% set BED = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER_TEMP|default(200)|float %}
    G90                              # XYZ absolus
    M83                              # extrusion relative
    M220 S100                        # facteur de vitesse à 100 %
    M221 S100                        # débit à 100 %
    # Plateau à température, buse à 150 °C (ne suinte pas pendant le palpage)
    M140 S{BED}
    M104 S150
    M190 S{BED}
    M109 S150
    G28
    BED_MESH_CALIBRATE ADAPTIVE=1    # remplace G29 L0 / M420 S1 (fondu sur 10 mm : fade_end)
    G1 Z5 F600
    G1 X3 Y3 F5000                   # attente à l'avant gauche
    M109 S{EXTRUDER}
    # Deux lignes de purge sur le bord avant
    G1 X10 Y0.5 F5000
    G1 Z0.25 F1200
    G1 X100 Y0.5 E12 F1500
    G1 X100 Y0.2 F5000
    G1 X10 Y0.2 E12 F1500
    G1 E-0.8 F2100
    G1 Z2 F3000

[gcode_macro PRINT_END]
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    M400
    G1 E-0.8 F2100                   # rétraction
    G91
    G1 Z1 X1 Y1 F1200                # petit dégagement
    G90
    G1 Z{[cur_z + 120, max_z]|min} F600   # monte de 120 mm (plafonné à la hauteur max)
    G1 X5 Y{max_y} F3000             # présente la pièce
    M220 S100
    M221 S100
    M106 S0
    M104 S0
    M140 S0
    M84 X Y E                        # garde Z alimenté pour ne pas faire tomber le portique

# Changement de filament en cours d'impression (M600 depuis OrcaSlicer)
[gcode_macro M600]
gcode:
    PAUSE
    UNLOAD_FILAMENT

# ---------------------------------------------------------------------
# Filament (M603 U100 → déchargement de 100 mm)
# ---------------------------------------------------------------------
[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% if printer.extruder.temperature < 170 %}
      { action_raise_error("Buse trop froide pour décharger (< 170 °C)") }
    {% endif %}
    M83
    G1 E10 F300                      # petite poussée pour éviter le bouchon
    G1 E-100 F1800
    M82

[gcode_macro LOAD_FILAMENT]
gcode:
    {% if printer.extruder.temperature < 170 %}
      { action_raise_error("Buse trop froide pour charger (< 170 °C)") }
    {% endif %}
    M83
    G1 E50 F300
    M82

# ---------------------------------------------------------------------
# Pause / reprise / annulation
# ---------------------------------------------------------------------
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set z_lift = 10 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set lift = [z_lift, max_z - act_z]|min %}
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-2 F2700
    G1 Z{lift} F600
    G90
    G1 X0 Y290 F6000

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    G91
    G1 E2 F2700
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=100
    BASE_RESUME

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    M106 S0
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT
    G91
    G1 Z10 F600
    G90
    G1 X0 Y290 F6000
    M84 X Y E
