# =====================================================================
#  Macros Sidewinder X1
#
#  PAUSE / RESUME / CANCEL_PRINT viennent de mainsail.cfg (macros officielles
#  Mainsail), réglées ici via _CLIENT_VARIABLE.
#
#  OrcaSlicer :
#    Démarrage :
#      SET_PRINT_STATS_INFO TOTAL_LAYER_COUNT=[total_layer_count]
#      PRINT_START BED_TEMP=[bed_temperature_initial_layer_single] EXTRUDER_TEMP=[nozzle_temperature_initial_layer]
#    Fin :                         PRINT_END
#    Avant changement de couche :  SET_PRINT_STATS_INFO CURRENT_LAYER={layer_num + 1}
#    Pause :                       PAUSE
#    Changement de filament :      M600
# =====================================================================

# ---------------------------------------------------------------------
# Réglages des macros Mainsail (pause, reprise, annulation)
# ---------------------------------------------------------------------
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True   ; position de parking personnalisée
variable_custom_park_x    : 5.0    ; à gauche
variable_custom_park_y    : 295.0  ; plateau vers l'avant (Y max)
variable_custom_park_dz   : 10.0   ; levée de la buse au parking
variable_retract          : 0.8    ; rétraction à la pause (comme le slicer)
variable_cancel_retract   : 5.0    ; rétraction à l'annulation
variable_speed_retract    : 35.0
variable_unretract        : 0.8    ; désrétraction à la reprise
variable_speed_unretract  : 35.0
variable_speed_hop        : 10.0   ; vitesse Z (max_z_velocity 12)
variable_speed_move       : 100.0
variable_park_at_cancel   : True   ; présenter la pièce à l'annulation aussi
variable_park_at_cancel_x : None
variable_park_at_cancel_y : None
variable_use_fw_retract   : False
variable_idle_timeout     : 1800   ; 30 min avant coupure des chauffes pendant une pause
variable_runout_sensor    : ""
variable_user_pause_macro : ""
variable_user_resume_macro: ""
variable_user_cancel_macro: ""
gcode:

# ---------------------------------------------------------------------
# Début d'impression
# ---------------------------------------------------------------------
[gcode_macro PRINT_START]
gcode:
    {% set BED = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER_TEMP|default(200)|float %}
    SET_GCODE_OFFSET Z=0             # oublie un babystep d'une impression précédente
    G90                              # XYZ absolus
    M83                              # extrusion relative
    M220 S100                        # facteur de vitesse à 100 %
    M221 S100                        # débit à 100 %
    # Plateau à température, buse à 150 °C (ne suinte pas pendant le palpage)
    M140 S{BED}
    M104 S150
    M190 S{BED}
    M109 S150
    G28
    BED_MESH_CALIBRATE ADAPTIVE=1    # maillage limité à la zone imprimée (fondu sur 10 mm)
    G1 Z5 F600
    G1 X3 Y3 F5000                   # attente à l'avant gauche
    M109 S{EXTRUDER}
    _PURGE_LINE

# Deux lignes de purge juste devant la zone imprimée (si OrcaSlicer déclare
# les objets avec « Exclude objects »), sinon sur le bord avant du plateau.
[gcode_macro _PURGE_LINE]
gcode:
    {% set length = 70.0 %}
    {% set extrude = 9.0 %}
    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set objects = printer.exclude_object.objects %}
    {% if objects|length > 0 %}
      {% set ns = namespace(min_x=max_x, min_y=printer.toolhead.axis_maximum.y|float) %}
      {% for obj in objects %}
        {% for point in obj.polygon %}
          {% set ns.min_x = [ns.min_x, point[0]]|min %}
          {% set ns.min_y = [ns.min_y, point[1]]|min %}
        {% endfor %}
      {% endfor %}
      {% set x0 = [[ns.min_x, 5.0]|max, max_x - length - 5.0]|min %}
      {% set y1 = [ns.min_y - 8.0, 0.5]|max %}
    {% else %}
      {% set x0 = 10.0 %}
      {% set y1 = 0.5 %}
    {% endif %}
    {% set y2 = y1 - 0.3 %}
    G1 X{x0} Y{y1} F5000
    G1 Z0.25 F1200
    G1 X{x0 + length} Y{y1} E{extrude} F1500
    G1 X{x0 + length} Y{y2} F5000
    G1 X{x0} Y{y2} E{extrude} F1500
    G1 E-0.8 F2100
    G1 Z2 F3000

# ---------------------------------------------------------------------
# Fin d'impression
# ---------------------------------------------------------------------
[gcode_macro PRINT_END]
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    M400
    G1 E-0.8 F2100                   # rétraction
    {% if 'xyz' in printer.toolhead.homed_axes %}
      G91
      G1 Z1 X1 Y1 F1200              # petit dégagement
      G90
      G1 Z{[cur_z + 120, max_z]|min} F600   # monte de 120 mm (plafonné à la hauteur max)
      G1 X5 Y{max_y} F3000           # présente la pièce
    {% endif %}
    M220 S100
    M221 S100
    M106 S0
    M104 S0
    M140 S0
    M84 X Y E                        # garde Z alimenté pour ne pas faire tomber le portique

# ---------------------------------------------------------------------
# Filament
# Chauffent automatiquement si la buse est froide (TEMP=… pour choisir,
# sinon la consigne en cours, ou 220 °C par défaut).
# ---------------------------------------------------------------------
[gcode_macro _FILAMENT_HEAT]
gcode:
    {% set target = printer.extruder.target|float %}
    {% set temp = params.TEMP|default(target if target >= 170 else 220)|float %}
    {% if target < 170 or printer.extruder.temperature < temp - 5 %}
      RESPOND MSG="Chauffe de la buse à {temp|int} °C"
      M109 S{temp}
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Décharge le filament (100 mm), chauffe si nécessaire
gcode:
    _FILAMENT_HEAT {rawparams}
    SAVE_GCODE_STATE NAME=filament_state
    M83
    G1 E10 F300                      # petite poussée pour éviter le bouchon
    G1 E-100 F1800                   # M603 U100 de l'époque Marlin
    RESTORE_GCODE_STATE NAME=filament_state

[gcode_macro LOAD_FILAMENT]
description: Charge le filament (50 mm), chauffe si nécessaire
gcode:
    _FILAMENT_HEAT {rawparams}
    SAVE_GCODE_STATE NAME=filament_state
    M83
    G1 E50 F300
    RESTORE_GCODE_STATE NAME=filament_state

# Changement de filament en cours d'impression : pause avec la buse
# à au moins 50 mm du plateau, puis déchargement. Recharger avec
# LOAD_FILAMENT puis RESUME.
[gcode_macro M600]
description: Changement de filament
gcode:
    PAUSE X=5 Y=295 Z_MIN=50
    UNLOAD_FILAMENT
