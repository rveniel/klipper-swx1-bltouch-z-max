# =====================================================================
#  Artillery Sidewinder X1 — carte MKS Gen L (ATmega2560), drivers TMC2100
#  3D Touch Geeetech, montage Waggster mod (sonde sur Z max)
#
#  Repris de rveniel/marlin-swx1 (branche aswx1_2.1.x_bltouch_waggster_mod_(z_max_used))
#  et de la conf EEPROM (M503).
#
#  Firmware MCU : make menuconfig → Atmega AVR / atmega2560 / 16 MHz,
#  communication série UART0, baud 250000.
# =====================================================================

[include macros.cfg]

[mcu]
# Rempli automatiquement depuis MCU_SERIAL (.env) au premier démarrage,
# sinon à remplacer par le chemin réel : ls /dev/serial/by-id/
serial: /dev/serial/by-id/CHANGEME
baud: 250000
restart_method: arduino

[printer]
kinematics: cartesian
max_velocity: 200            # M203 X200 Y200
max_accel: 1000              # M201 X1000 Y1000 (à remonter après input shaping)
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0  # équivalent approximatif du jerk 8 de Marlin
max_z_velocity: 12           # M203 Z12
max_z_accel: 100             # M201 Z100

# ---------------------------------------------------------------------
# Moteurs (16 micropas, rotation_distance = 3200 / steps/mm du M92)
# ---------------------------------------------------------------------
[stepper_x]
step_pin: PF0
dir_pin: PF1                 # INVERT_X_DIR false
enable_pin: !PD7
microsteps: 16
rotation_distance: 39.9396   # M92 X80.121
endstop_pin: ^!PE5           # X min (D3), X_MIN_ENDSTOP_INVERTING true → déclenché à l'état bas
position_endstop: -3         # X_MIN_POS -3
position_min: -3
position_max: 300
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: PF7                 # INVERT_Y_DIR false
enable_pin: !PF2
microsteps: 16
rotation_distance: 39.9396   # M92 Y80.121
endstop_pin: ^!PJ1           # Y min (D14)
position_endstop: -3         # Y_MIN_POS -3
position_min: -3
position_max: 300
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: !PL1                # INVERT_Z_DIR true
enable_pin: !PK0
microsteps: 16
rotation_distance: 8.0044    # M92 Z399.778
endstop_pin: probe:z_virtual_endstop
position_min: -2             # marge pour ajuster le z_offset
position_max: 400
homing_speed: 4
second_homing_speed: 2

# ---------------------------------------------------------------------
# Extrudeur (Titan) et buse
# ---------------------------------------------------------------------
[extruder]
step_pin: PA4
dir_pin: PA6                 # INVERT_E0_DIR false
enable_pin: !PA2
microsteps: 16
rotation_distance: 7.191     # M92 E445 — à recalibrer, et à refaire si passage au BMG Wind
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 200   # EXTRUDE_MAXLENGTH
max_extrude_only_velocity: 60
max_extrude_only_accel: 2000
pressure_advance: 0.12       # repris de M900 K0.12 — à recalibrer
heater_pin: PB4              # D10
sensor_type: EPCOS 100K B57560G104F   # TEMP_SENSOR_0 1
sensor_pin: PK5              # A13
control: pid
pid_Kp: 28.017               # M301 — à refaire avec PID_CALIBRATE
pid_Ki: 5.516
pid_Kd: 35.575
min_temp: 0
max_temp: 275                # HEATER_0_MAXTEMP
min_extrude_temp: 170

[heater_bed]
heater_pin: PH5              # D8
sensor_type: EPCOS 100K B57560G104F   # TEMP_SENSOR_BED 1
sensor_pin: PK6              # A14
control: pid
pid_Kp: 16.407               # M304 — à refaire avec PID_CALIBRATE
pid_Ki: 0.915
pid_Kd: 196.231
min_temp: 0
max_temp: 130

# ---------------------------------------------------------------------
# Ventilateurs
# ---------------------------------------------------------------------
[fan]
pin: PH6                     # D9, ventilateur de pièce

[heater_fan hotend_fan]
pin: PH4                     # D7 (E0_AUTO_FAN_PIN)
heater: extruder
heater_temp: 50.0            # EXTRUDER_AUTO_FAN_TEMPERATURE

# ---------------------------------------------------------------------
# Sonde 3D Touch — Waggster mod : signal sur Z max, commande sur la broche servo
# ---------------------------------------------------------------------
[bltouch]
sensor_pin: ^PD2             # D19 = Z max (Z_MIN_PROBE_PIN 19)
control_pin: PB5             # D11 = SERVO0_PIN
x_offset: 33                 # M851 X33 (le Configuration.h dit 28, l'EEPROM fait foi)
y_offset: -33                # M851 Y-33
z_offset: 1.74               # M851 Z-1.74 → signe inversé dans Klipper ; refaire PROBE_CALIBRATE
speed: 4                     # Z_PROBE_FEEDRATE_FAST
samples: 2                   # MULTIPLE_PROBING 2
sample_retract_dist: 3
samples_tolerance: 0.05
samples_tolerance_retries: 3
# Le Marlin utilisait BLTOUCH_SET_5V_MODE. Beaucoup de clones ignorent cette commande :
# à n'activer que si la sonde la supporte.
#set_output_mode: 5V
# Si erreur "BLTouch failed to verify sensor state" avec le clone :
#pin_up_touch_mode_reports_triggered: False

[safe_z_home]
# Nozzle placée pour que la sonde tombe au centre du plateau (150,150)
home_xy_position: 117, 183
speed: 100
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 150
horizontal_move_z: 5
# Coordonnées de la SONDE. La sonde va de X30 à X300 et de Y-36 à Y267.
mesh_min: 35, 10
mesh_max: 290, 260
probe_count: 7, 7            # comme l'UBL 7x7
algorithm: bicubic
fade_start: 1
fade_end: 10

# ---------------------------------------------------------------------
# Écran TFT en mode Marlin (émulation ST7920) — brochage Digant
# ---------------------------------------------------------------------
[display]
lcd_type: st7920
cs_pin: PC6                  # EXP2_03 (D31) — remappé par Digant
sclk_pin: PA1                # EXP1_05 (D23)
sid_pin: PH0                 # EXP1_03 (D17)
encoder_pins: ^PH1, ^PA3     # EXP1_04 (D16), EXP1_06 (D25) — remappés par Digant
click_pin: ^!PC2             # EXP1_02 (D35)

# ---------------------------------------------------------------------
# Bandeau LED RGB (D5/D4/D6). Le Waggster mod récupère une partie du câble LED :
# à n'activer que si les couleurs restantes sont encore câblées.
# ---------------------------------------------------------------------
#[led hotend_led]
#red_pin: PE3                # D5
#green_pin: PG5              # D4
#blue_pin: PH3               # D6

# ---------------------------------------------------------------------
# Intégration Moonraker / Mainsail
# ---------------------------------------------------------------------
[virtual_sdcard]
path: /opt/printer_data/gcodes   # chemin dans les conteneurs prind
on_error_gcode: CANCEL_PRINT

[pause_resume]
[display_status]
[exclude_object]
[gcode_arcs]
resolution: 0.1

# ---------------------------------------------------------------------
# Input shaping : à décommenter quand l'ADXL345 USB est branché
# (second MCU flashé Klipper, en RP2040).
